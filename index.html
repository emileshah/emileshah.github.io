<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tea leaf — a shelf of everything i've steeped so far</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ==== HEADER ====
       Edit the title/tagline text directly here. -->
  <header class="site-header">
    <h1 class="site-title">tea leaf</h1>
    <p class="site-tagline">a shelf of everything i've steeped so far</p>
  </header>

  <!-- ==== THE SHELF ====
       #shelf-grid is filled in automatically by script.js, using the
       chapters listed in content.js. Don't edit jars here -- edit
       content.js instead. -->
  <main class="shelf-wrap" id="shelf-wrap">

    <!-- optional cozy-corner decorations -- delete any <img> below if
         you don't want it, or swap the src for your own art -->
    <img class="decor decor-plant" src="images/decor/potted-plant.svg" alt="" aria-hidden="true" />
    <img class="decor decor-teacup" src="images/decor/teacup.svg" alt="" aria-hidden="true" />
    <img class="decor decor-books" src="images/decor/books.svg" alt="" aria-hidden="true" />

    <div class="shelf-grid" id="shelf-grid"></div>
  </main>

  <!-- ==== OPENED JAR CARD ====
       One shared card element, re-used and re-filled for whichever
       jar was clicked. Don't duplicate this per chapter. -->
  <div class="overlay" id="overlay"></div>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <button class="card-close" id="card-close" aria-label="close">×</button>
    <img class="card-leaf" id="card-leaf" src="" alt="" />
    <h2 class="card-title" id="card-title"></h2>
    <p class="card-tea-type" id="card-tea-type"></p>
    <p class="card-section-label">the chapter</p>
    <p class="card-text" id="card-description"></p>
    <p class="card-section-label">how it shaped me</p>
    <p class="card-text" id="card-impact"></p>
  </div>

  <footer class="site-footer">open a jar to read the story behind it</footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
